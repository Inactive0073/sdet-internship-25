name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-api:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Bring up services
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
        run: |
          docker compose down
          docker compose up --build -d

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            echo "Attempt $i: checking API..."
            if curl -s --fail http://localhost:8080/api/getAll > /dev/null; then
              echo "✅ API is up!"
              exit 0
            fi
            sleep 3
          done
          echo "❌ API failed to start in time"
          docker compose logs
          exit 1
      
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests (synchronous)
        run: pytest -m api -n 0 --alluredir=allure-results-api -q

      - uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results-api

      - run: |
          npm install -g allure-commandline --save-dev
          allure generate allure-results-api --clean -o allure-report-api

      - uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report-api

  